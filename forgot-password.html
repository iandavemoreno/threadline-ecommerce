<!DOCTYPE html>
<html>
    <head>
        <title>ThreadLine - Forgot Password</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </nav>
        </header>

        <main>
            <h2>Forgot Password</h2>
            <p>Enter your email and we'll send you a link to reset your password.</p>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="forgot-password-email">Email</label>
                    <input type="text" id="forgot-password-email">
                    <p class="error" id="forgot-password-email-error"></p>
                </div>

                <button type="subtmit">Send Reset Link</button>
                <p id="forgot-password-message"></p>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js?v=3"></script>
    </body>
</html>
