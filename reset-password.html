<!DOCTYPE html>
<html>
    <head>
        <title>ThreadLine - Reset Password</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="1a1a2e">
    </head>
    <body>
        <div id="toast"></div>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </nav>
        </header>

        <main>
            <h2>Reset Password</h2>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="reset-password-new">New Password</label>
                    <input type="password" id="reset-password-new">
                    <p class="error" id="reset-password-new-error"></p>"
                </div>

                <div class="form-group">
                    <label for="reset-password-confirm">Confirm New Password</label>
                    <input type="password" id="reset-password-confirm">
                    <p class="error" id="reset-password-confirm-error"></p>
                </div>

                <button type="submit">Reset Password</button>
                <p class="error" id="reset-password-form-error"></p>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js?v=3"></script>
    </body>
</html>
