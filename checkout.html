<!DOCTYPE html>
<html>
    <head>
        <title>My Shop - Checkout</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="signout-btn">Sign Out</button>
            </nav>
        </header>
        
        <main>
            <h2>Checkout</h2>
            <p id="checkout-access-message"></p>

            <div id="checkout-content" style="display: none;">
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name">
                        <p class="error" id="name-error"></p>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email">
                        <p class="error" id="email-error"></p>
                    </div>

                    <div class="form-group">
                        <label for="address">Shipping Address</label>
                        <input type="text" id="address">
                        <p class="error" id="address-error"></p>
                    </div>

                    <div class="form-group">
                        <label for="coupon-code">Promo Code (optional)</label>
                        <div class="coupon-row">
                            <input type="text" id="coupon-code" placeholder="e.g. WELCOME10">
                            <button type="button" id="apply-coupon-btn">Apply</button>
                        </div>
                        <p id="coupon-message"></p>
                    </div>

                    <div id="order-summary">
                        <p>Subtotal: $<span id="summary-subtotal">0.00</span></p>
                        <p id="summary-discount-row" style="display: none;">Discount: -$<span id="summary-discount">0.00</span></p>
                        <p class="order-total">Total: $<span id="summary-total">0.00</span></p>
                    </div>

                    <button type="submit">Place Order</button>
                </form>

                <div id="order-confirmation"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
