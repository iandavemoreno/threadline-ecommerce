<!DOCTYPE html>
<html>
    <head>
        <title>My Shop - Product Details</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="signout-btn">Sign Out</button>
            </nav>
        </header>

        <main>
            <p><a href="index.html">&larr; Back to all products</a></p>
            <div id="product-detail" class="product"></div>

            <div id="reviews-section">
                <h3>Reviews</h3>
                <p id="reviews-summary"></p>
                <div id="reviews-list"></div>

                <p id="review-access-message"></p>
                <form id="review-form" style="display: none;">
                    <div class="form-group">
                        <label for="review-rating">Your Rating</label>
                        <select id="review-rating">
                            <option value="">Select a rating</option>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="review-comment">Comment (optional)</label>
                        <textarea id="review-comment" rows="3"></textarea>
                    </div>
                    <button type="submit">Submit Review</button>
                    <p id="review-message"></p>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js?v=3"></script>
        <div id="toast" class="toast"></div>
    </body>
</html>
