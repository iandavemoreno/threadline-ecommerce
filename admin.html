<!DOCTYPE html>
<html>
    <head>
        <title>My Shop - Admin</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="signout-btn">Sign Out</button>
            </nav>
        </header>
        <main>
            <h2>Admin Dashboard</h2>
            <p id="admin-access-message"></p>
            <div id="admin-content" style="display: none;">
                <h3>Dashboard</h3>
                <div id="dashboard-stats">
                    <p>Total Revenue: <span id="dashboard-revenue"></span></p>
                    <p>
                        Pending: <span id="dashboard-count-pending"></span> |
                        Shipped: <span id="dashboard-count-shipped"></span> |
                        Delivered: <span id="dashboard-count-delivered"></span> |
                        Cancelled: <span id="dashboard-count-cancelled"></span>
                    </p>
                </div>
                <h4>Top Products</h4>
                <ol id="dashboard-top-products"></ol>
                <hr>
                <h3>Add a Product</h3>
                <form id="add-product-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name">
                    </div>
                    <div class="form-group">
                        <label for="product-price">Price</label>
                        <input type="text" id="product-price">
                    </div>
                    <div class="form-group">
                        <label for="product-stock">Stock</label>
                        <input type="text" id="product-stock">
                    </div>
                    <div class="form-group">
                        <label for="product-category">Category</label>
                        <input type="text" id="product-category" placeholder="e.g. T-Shirts">
                    </div>
                    <div class="form-group">
                        <label for="product-description">Description (optional)</label>
                        <textarea id="product-description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-image">Product Image</label>
                        <input type="file" id="product-image" accept="image/*">
                    </div>
                    <button type="submit">Add Product</button>
                    <p class="error" id="add-product-error"></p>
                </form>
                <hr>
                <h3>Existing Products</h3>
                <div id="admin-product-list"></div>
                <hr>
                <h3>All Orders</h3>
                <div id="admin-order-list"></div>

                <hr>
                <h3>Coupons</h3>

                <form id="add-coupon-form">
                    <div class="form-group">
                        <label for="new-coupon-code">Code</label>
                        <input type="text" id="new-coupon-code" required>
                    </div>
                    <div class="form-group">
                        <label for="new-coupon-discount">Discount %</label>
                        <input type="number" id="new-coupon-discount" min="1" max="100" required>
                    </div>
                    <button type="submit">Add Coupon</button>
                </form>

                <div id="admin-coupon-list"></div>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>
        <script src="script.js"></script>
        <div id="toast" class="toast"></div>
    </body>
</html>
