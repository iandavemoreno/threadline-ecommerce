<!DOCTYPE html>
<html>
    <head>
        <title>My Shop - My Orders</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="signout-btn">Sign Out</button>
            </nav>
        </header>

        <main>
            <h2>My Orders</h2>
            <p id="orders-access-message"></p>

            <div id="orders-content" style="display: none;">
                <div class="order-tabs" id="order-tabs">
                    <button type="button" class="order-tab active" data-status="All">All</button>
                    <button type="button" class="order-tab" data-status="Pending">Pending</button>
                    <button type="button" class="order-tab" data-status="Shipped">Shipped</button>
                    <button type="button" class="order-tab" data-status="Delivered">Delivered</button>
                    <button type="button" class="order-tab" data-status="Cancelled">Cancelled</button>
                </div>
                <p id="no-orders-message" class="no-products-message">
                    You haven't placed any orders yet.
                </p>
                <div id="orders-list"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js?v=2"></script>
    </body>
</html>
