<!DOCTYPE html>
<html>
    <head>
        <title>My Shop - My Profile</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>ThreadLine</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="signout-btn">Sign Out</button>
            </nav>
        </header>

        <main>
            <h2>My Profile</h2>
            <p id="profile-access-message"></p>

            <div id="profile-content" style="display: none;">
                <p>Email: <span id="profile-email"></span></p>
                <p>Account type: <span id="profile-role"></span></p>

                <hr>

                <h3>Default Shipping Info</h3>
                <p>Saved here pre-fills your name and address at checkout - you can still change them for any individual order.</p>
                <form id="shipping-form">
                    <div class="form-group">
                        <label for="default-name">Full Name</label>
                        <input type="text" id="default-name">
                    </div>
                    <div class="form-group">
                        <label for="default-address">Shipping Address</label>
                        <input type="text" id="default-address">
                    </div>
                    <button type="submit">Save Shipping Info</button>
                    <p id="shipping-message"></p>
                </form>

                <hr>

                <h3>Change Password</h3>
                <form id="password-form">
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input type="password" id="confirm-new-password">
                    </div>
                    <button type="submit">Change Password</button>
                    <p id="password-message"></p>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ThreadLine</p>
        </footer>

        <script src="script.js"></script>
        <div id="toast" class="toast"></div>
    </body>
</html>
