name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start backend server
        working-directory: ./backend
        run: nohup node server.js > backend.log 2>&1 &

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Show backend log if it failed to start
        if: failure()
        run: cat backend/backend.log

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Install frontend/test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Serve frontend with a static server
        run: npx http-server . -p 5500 &

      - name: Wait for frontend to be ready
        run: npx wait-on http://127.0.0.1:5500 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14